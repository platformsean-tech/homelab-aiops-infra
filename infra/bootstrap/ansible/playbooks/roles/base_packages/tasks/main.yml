---
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 0
  become: yes

- name: Install base packages
  apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: yes
    cache_valid_time: 0
  become: yes
  retries: 5

- name: Install Python packages with pip
  pip:
    name: "{{ pip_packages }}"
    executable: pip3
    extra_args: --break-system-packages
  become: yes

